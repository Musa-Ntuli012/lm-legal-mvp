name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  DATABASE_URL: postgres://lmlegal:lmlegal_pass@localhost:5432/lmlegal_test
  APP_URL: http://localhost:5173

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lmlegal
          POSTGRES_PASSWORD: lmlegal_pass
          POSTGRES_DB: lmlegal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U lmlegal -d lmlegal_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp

      - name: Install server dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/server

      - name: Install client dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/client

      - name: Run server lint
        run: npm run lint
        working-directory: /home/user/lm-legal-mvp/server

      - name: Run client lint
        run: npm run lint
        working-directory: /home/user/lm-legal-mvp/client

      - name: Run server typecheck
        run: npm run typecheck
        working-directory: /home/user/lm-legal-mvp/server

      - name: Run client typecheck
        run: npm run typecheck
        working-directory: /home/user/lm-legal-mvp/client

  test:
    name: Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lmlegal
          POSTGRES_PASSWORD: lmlegal_pass
          POSTGRES_DB: lmlegal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U lmlegal -d lmlegal_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp

      - name: Install server dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/server

      - name: Install client dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/client

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: /home/user/lm-legal-mvp/server

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: /home/user/lm-legal-mvp/server
        env:
          DATABASE_URL: postgres://lmlegal:lmlegal_pass@localhost:5432/lmlegal_test

      - name: Seed database
        run: npm run seed
        working-directory: /home/user/lm-legal-mvp/server

      - name: Run server tests
        run: npm run test
        working-directory: /home/user/lm-legal-mvp/server

      - name: Run client tests
        run: npm run test
        working-directory: /home/user/lm-legal-mvp/client

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp

      - name: Install server dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/server

      - name: Install client dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/client

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: /home/user/lm-legal-mvp/server

      - name: Build server
        run: npm run build
        working-directory: /home/user/lm-legal-mvp/server

      - name: Build client
        run: npm run build
        working-directory: /home/user/lm-legal-mvp/client

  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp

      - name: Install server dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/server

      - name: Install client dependencies
        run: npm ci
        working-directory: /home/user/lm-legal-mvp/client

      - name: Run server audit
        run: npm audit --audit-level=moderate
        working-directory: /home/user/lm-legal-mvp/server
        continue-on-error: true

      - name: Run client audit
        run: npm audit --audit-level=moderate
        working-directory: /home/user/lm-legal-mvp/client
        continue-on-error: true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
